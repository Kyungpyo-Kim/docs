<text x="150" y="560" font-size="13" fill="#182532" font-weight="400" text-anchor="start">각 그룹 안에서 큰 값이 같은 부호로 곱해져 범위가 좁아진다. 하모닉 행은 길이 2^k의 all +1/−1 패턴이다.</text>
<text x="150" y="582" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">HAP는 값을 바꾸지 않는 채널 치환이라 가중치에 미리 합칠 수 있고, 런타임 오버헤드가 없다(논문 §V-B).</text>
