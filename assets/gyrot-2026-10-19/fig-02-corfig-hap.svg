<text x="535.0" y="110" font-size="12" fill="#2563eb" font-weight="750" text-anchor="middle">회전 구역 R = 32 (2^g · G, g=2)</text>
<text x="30" y="238" font-size="13" fill="#182532" font-weight="400" text-anchor="start">· 그룹은 8개 채널씩 잘게 나눠 각자 스케일을 쓴다(파란/초록/주황/보라 상자).</text>
<text x="30" y="257" font-size="13" fill="#182532" font-weight="400" text-anchor="start">· 회전은 그 4개 그룹을 아우르는 32개 채널 안에서만 일어난다. 그래서 작은 그룹의 지역성을 해치지 않는다.</text>
