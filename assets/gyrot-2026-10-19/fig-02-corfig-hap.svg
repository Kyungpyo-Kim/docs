<text x="30" y="42" font-size="24" fill="#102a43" font-weight="750" text-anchor="start">CoRFiG + HAP 개념도</text>
<text x="30" y="66" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">독자적 재구성 도식 (원문 그림 아님) · 논문 Fig. 3·4, §IV-A 참조 · 예시 G=8, R=32</text>
