<text x="585" y="446" font-size="11" fill="#102a43" font-weight="400" text-anchor="start">■ LightRot  ■ GyRot</text>
<text x="30" y="470" font-size="13" fill="#b42318" font-weight="750" text-anchor="start">FP16에서는 LightRot와 GyRot가 비슷하다. INT8로 낮추면 LightRot는 G=64/32에서 36.33/30.12로 무너지고 GyRot는 7.00/6.91로 버틴다.</text>
<text x="30" y="494" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">LightRot는 부동소수점 0점에 의존하기 때문이다. 이것이 GyRot의 핵심 차별점이다(논문 §VI-B).</text>
