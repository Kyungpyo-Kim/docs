<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif">
<title id="t">비대칭 양자화 재구성과 0점 올림</title>
<desc id="d">전통 방식과 재구성 방식의 순서 차이, 그리고 올림이 언더플로를 막는 원리를 재구성한 도식</desc>
<rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<text x="30" y="42" font-size="24" fill="#102a43" font-weight="750" text-anchor="start">비대칭 양자화 재구성과 0점 올림</text>
<text x="30" y="66" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">독자적 재구성 도식 (원문 그림 아님) · 논문 Fig. 5·6, §IV-B 참조</text>
<rect x="30" y="92" width="455" height="240" rx="14" fill="#fdf1e7" stroke="#d9e2ec" stroke-width="1"/>
<text x="48" y="124" font-size="15" fill="#c2410c" font-weight="750" text-anchor="start">전통 방식: 스케일 먼저, 0점 나중</text>
<text x="48" y="152" font-size="13" fill="#182532" font-weight="400" text-anchor="start">x  →  x ÷ s  →  x ÷ s + z</text>
<text x="48" y="180" font-size="13" fill="#182532" font-weight="400" text-anchor="start">0점 z = −min(x)/s (스케일 영역)</text>
<text x="48" y="199" font-size="13" fill="#182532" font-weight="400" text-anchor="start">스케일이 작으면 z가 크게 증폭되고</text>
<text x="48" y="218" font-size="13" fill="#182532" font-weight="400" text-anchor="start">꼬리가 긴 분포가 된다.</text>
<polyline points="48.0,260.0 53.0,264.3 58.0,268.2 63.0,271.7 68.0,274.8 73.0,277.7 78.0,280.3 83.0,282.7 88.0,284.8 93.0,286.7 98.0,288.4 103.0,290.0 108.0,291.4 113.0,292.7 118.0,293.9 123.0,295.0 128.0,295.9 133.0,296.8 138.0,297.6 143.0,298.3 148.0,298.9 153.0,299.5 158.0,300.0 163.0,300.5 168.0,300.9 173.0,301.3 178.0,301.7 183.0,302.0 188.0,302.3 193.0,302.5 198.0,302.7 203.0,302.9 208.0,303.1 213.0,303.2 218.0,303.3 223.0,303.4 228.0,303.4 233.0,303.3 238.0,303.1 243.0,302.9 248.0,302.5 253.0,302.0 258.0,301.3 263.0,300.5 268.0,299.5 273.0,298.4 278.0,297.2 283.0,295.9 288.0,294.6 293.0,293.3 298.0,292.1 303.0,291.2 308.0,290.4 313.0,289.9 318.0,289.8 323.0,290.0 328.0,290.5 333.0,291.3 338.0,292.3 343.0,293.5" fill="none" stroke="#c2410c" stroke-width="2.5"/>
<text x="48" y="322" font-size="12" fill="#c2410c" font-weight="750" text-anchor="start">0점 분포: 꼬리가 길다</text>
<rect x="515" y="92" width="455" height="240" rx="14" fill="#e8f7f4" stroke="#d9e2ec" stroke-width="1"/>
<text x="533" y="124" font-size="15" fill="#0f766e" font-weight="750" text-anchor="start">재구성: 0점 먼저(원래 값 영역), 스케일 나중</text>
<text x="533" y="152" font-size="13" fill="#182532" font-weight="400" text-anchor="start">x  →  x + z  →  (x + z) ÷ s</text>
<text x="533" y="180" font-size="13" fill="#182532" font-weight="400" text-anchor="start">0점 z = −min(x) (스케일 영역 아님)</text>
<text x="533" y="199" font-size="13" fill="#182532" font-weight="400" text-anchor="start">나눗셈이 없어 증폭이 줄고</text>
<text x="533" y="218" font-size="13" fill="#182532" font-weight="400" text-anchor="start">분포가 평평해진다.</text>
<polyline points="533.0,299.5 538.0,298.2 543.0,296.8 548.0,295.1 553.0,293.2 558.0,291.1 563.0,288.8 568.0,286.2 573.0,283.5 578.0,280.7 583.0,277.7 588.0,274.7 593.0,271.7 598.0,268.7 603.0,265.9 608.0,263.2 613.0,260.9 618.0,258.8 623.0,257.2 628.0,256.0 633.0,255.2 638.0,255.0 643.0,255.2 648.0,256.0 653.0,257.2 658.0,258.8 663.0,260.9 668.0,263.2 673.0,265.9 678.0,268.7 683.0,271.7 688.0,274.7 693.0,277.7 698.0,280.7 703.0,283.5 708.0,286.2 713.0,288.8 718.0,291.1 723.0,293.2 728.0,295.1 733.0,296.8 738.0,298.2 743.0,299.5 748.0,300.6 753.0,301.4 758.0,302.2 763.0,302.8 768.0,303.3 773.0,303.7 778.0,304.0 783.0,304.3 788.0,304.4 793.0,304.6 798.0,304.7 803.0,304.8 808.0,304.8 813.0,304.9 818.0,304.9 823.0,304.9 828.0,305.0" fill="none" stroke="#0f766e" stroke-width="2.5"/>
<text x="533" y="322" font-size="12" fill="#0f766e" font-weight="750" text-anchor="start">0점 분포: 꼬리가 짧다</text>
<rect x="30" y="352" width="940" height="210" rx="14" fill="#f8fbff" stroke="#d9e2ec" stroke-width="1"/>
<text x="48" y="386" font-size="15" fill="#102a43" font-weight="750" text-anchor="start">0점 올림이 왜 필요한가 (설명용 가상 숫자: 실제 최솟값 = −7.3)</text>
<line x1="90" y1="440" x2="900" y2="440" stroke="#182532" stroke-width="2"/>
<line x1="90.0" y1="434" x2="90.0" y2="446" stroke="#5f7183" stroke-width="1"/>
<text x="90.0" y="466" font-size="11" fill="#5f7183" font-weight="400" text-anchor="middle">7.0</text>
<line x1="241.87499999999994" y1="434" x2="241.87499999999994" y2="446" stroke="#5f7183" stroke-width="1"/>
<text x="241.87499999999994" y="466" font-size="11" fill="#5f7183" font-weight="400" text-anchor="middle">7.3</text>
<line x1="343.12500000000006" y1="434" x2="343.12500000000006" y2="446" stroke="#5f7183" stroke-width="1"/>
<text x="343.12500000000006" y="466" font-size="11" fill="#5f7183" font-weight="400" text-anchor="middle">7.5</text>
<line x1="596.2500000000001" y1="434" x2="596.2500000000001" y2="446" stroke="#5f7183" stroke-width="1"/>
<text x="596.2500000000001" y="466" font-size="11" fill="#5f7183" font-weight="400" text-anchor="middle">8.0</text>
<line x1="849.3750000000002" y1="434" x2="849.3750000000002" y2="446" stroke="#5f7183" stroke-width="1"/>
<text x="849.3750000000002" y="466" font-size="11" fill="#5f7183" font-weight="400" text-anchor="middle">8.5</text>
<circle cx="241.9" cy="440" r="7" fill="#2563eb"/>
<text x="241.87499999999994" y="500" font-size="11" fill="#2563eb" font-weight="750" text-anchor="middle">실제 0점 7.3</text>
<circle cx="306.2" cy="414" r="6" fill="#b42318"/>
<text x="306.1687499999998" y="404" font-size="11" fill="#b42318" font-weight="750" text-anchor="middle">반올림 → 7</text>
<circle cx="596.3" cy="414" r="6" fill="#0f766e"/>
<text x="596.2500000000001" y="404" font-size="11" fill="#0f766e" font-weight="750" text-anchor="middle">올림 → 8</text>
<text x="48" y="522" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">반올림이 7.3보다 작은 7이 되면 가장 작은 값이 0 아래로 내려가 잘린다(언더플로). 올림은 양자화된 0점을 실제 0점 이상으로 만들어 언더플로를 막는다.</text>
<text x="48" y="541" font-size="12" fill="#5f7183" font-weight="400" text-anchor="start">이 값은 원리를 보여 주기 위한 가상 숫자다. 실제 측정은 논문 Fig. 5·6과 Table V(11쪽)에 있다.</text>
<line x1="487" y1="212" x2="511" y2="212" stroke="#2563eb" stroke-width="3" marker-end="url(#ah)"/>
</svg>
